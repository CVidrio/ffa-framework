# ------------------ #
# DIRECTORY SETTINGS #
# ------------------ #

# Location of .csv files
data_folder: "~/Desktop/data"         

# Name of .csv files in data_dir. Set to null to run on all files in data_folder.
csv_files: 
  - "Application_1.csv"

# Path to folder for generating reports
report_folder: "~/Desktop/reports"    

# ------------ #
# EDA SETTINGS #
# ------------ #

# Mode for running EDA (must be "preset", "automatic", or "manual")
mode: "manual"

# Preset split points (only works with mode: "preset")
split_points: null

# Significance threshold for statistical tests
alpha: 0.05

# Number of bootstrap samples in BB-MK test
bbmk_repetitions: 10000    

# Window length used to compute AMS variances
window_length: 10          

# Window step used to compute AMS variances
window_step: 5             

# Add a line between data points when generating plots
show_trend: True

# Enable report generation 
generate_report: True   

# Set output format for reports
report_format: 
  - "html_document"
