# ------------------ #
# DIRECTORY SETTINGS #
# ------------------ #

# Location of .csv files (set to null to use ffa-framework/data)
data_folder: null         

# Name of .csv files in data_dir. Set to null to run on all files in data_folder.
csv_files: 
  - "Application_1.csv"

# Path to reports folder (set to null to use ffa-framework/reports)
report_folder: null

# ------------ #
# EDA SETTINGS #
# ------------ #

# Mode for running EDA ("preset", "automatic", or "manual")
mode: "manual"

# Preset split points (only works with mode: "preset")
split_points: null

# Significance threshold for statistical tests
alpha: 0.05

# Number of bootstrap samples in BB-MK test
bbmk_repetitions: 10000    

# Window length used to compute AMS variances
window_length: 10          

# Window step used to compute AMS variances
window_step: 5             

# Add a line between data points when generating plots
show_trend: True

# Enable report generation 
generate_report: True   

# Output format for reports ("md_document", "html_document", or "pdf_document")
report_format: 
  - "html_document"
  - "pdf_document"

# ------------ #
# FFA SETTINGS #
# ------------ #

# Distribution selection metric ("L-distance", "L-kurtosis", "Z-statistic")
selection_metric: "L-distance"

# Parameter estimation method ("L-moments", "MLE", "GMLE")
estimation_method: "L-moments"

# Uncertainty quantification method ("S-bootstrap", "RFPL", "RFGPL")
uncertainty_method: "S-bootstrap"
