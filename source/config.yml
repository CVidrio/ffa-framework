
##########################
### DIRECTORY SETTINGS ###
##########################

# Location of .csv files
data_folder: "~/Code/ffa-framework/data"         

# Name of .csv file in data_dir
csv_file: "Application_3.1.csv"                    

# Path for generating reports
report_folder: "~/Code/ffa-framework/reports"    

####################
### EDA SETTINGS ###
####################

# Significance threshold for statistical tests
alpha: 0.05

# Number of bootstrap samples in BB-MK test
bbmk_repetitions: 10000    

# Window length used to compute AMS variances
window_length: 10          

# Window step used to compute AMS variances
window_step: 5             

#####################
### PLOT SETTINGS ###
#####################

# Add a line between data points when generating plots
show_trend: True

#######################
### REPORT SETTINGS ###
#######################

# Enable report generation. Overrides settings below.
generate_report: True   

# Set output format for reports
report_format: 
  - "html_document"

# Include description of the statistical test and hypotheses
include_description: False  

# Include details of the statistical test (i.e. equations)
include_details: False  

# Include the code used to run statistical tests / draw plots
include_code: False     
